<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<title>testmail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>%F0%9F%93%AC</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="brand"><span class="dot" id="live" title="connecting…"></span> testmail</span>

  <button class="address" id="address" title="Click to copy">
    <span id="address-text">…</span>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
    </svg>
  </button>

  <span class="spacer"></span>

  <button class="btn back" id="back">← Inbox</button>
  <button class="btn" id="rotate" title="Throw this address away and get a new one">New address</button>
  <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</header>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="search">
      <input id="search" type="search" placeholder="Filter by sender, subject or code…" autocomplete="off">
    </div>
    <ul class="list" id="list" role="listbox" aria-label="Inbox"></ul>
  </aside>

  <main class="detail" id="detail"></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
