<!doctype html>
<html lang="en" data-theme="auto" data-accent="blue" data-density="comfortable">
<head>
<meta charset="utf-8">
<title>catchbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230071e3'/><path d='M8 11h16v10H8z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/><path d='m8 11 8 6 8-6' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
  <!-- Mailboxes. Rendered by app.js; the frame around them is static. -->
  <nav class="side" aria-label="Mailboxes">
    <div class="side-head">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16v11H4z"/><path d="m4 7 8 6 8-6"/></svg>
        </span>
        catchbox
      </span>
      <span class="chip demo" id="demo-chip" hidden>Demo</span>
    </div>

    <button class="compose" id="add-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New mailbox
    </button>

    <div class="rail" id="rail"></div>

    <div class="side-foot">
      <span class="live" id="live-status">
        <span class="dot" id="live"></span>
        <span id="live-text">Connecting…</span>
      </span>
      <span class="grow"></span>
      <button class="icon-btn" id="theme" title="Switch theme" aria-label="Switch theme">
        <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn" id="settings-open" title="Settings ( , )" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </nav>

  <!-- The list of messages in the mailbox being viewed. -->
  <section class="list-pane" aria-label="Messages">
    <header class="list-head">
      <div class="title-row">
        <h1 id="box-title">Inbox</h1>
        <span class="count" id="box-count"></span>
      </div>
      <button class="address" id="address" title="Copy this address ( y )">
        <span id="address-text">…</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
        </svg>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search sender, subject or code" autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
      </label>
    </header>
    <ul class="list" id="list" role="listbox" aria-label="Inbox"></ul>
  </section>

  <main class="reader" id="detail"></main>
</div>

<section class="settings" id="settings" hidden>
  <div class="settings-inner" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-head">
      <h1 id="settings-title">Settings</h1>
      <button class="btn primary" id="settings-close">Done</button>
    </div>
    <div id="settings-body"></div>
  </div>
</section>

<div class="offline" id="offline" hidden role="alert">
  <b>The catchbox server is not running.</b>
  <span>This page is open on <code id="offline-origin"></code>. Start it with <code>catchbox ui</code>, or check whether you meant another port.</span>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
