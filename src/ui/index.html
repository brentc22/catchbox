<!doctype html>
<html lang="en" data-theme="auto" data-accent="indigo" data-density="comfortable">
<head>
<meta charset="utf-8">
<title>catchbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>%F0%9F%93%AC</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <span class="brand">
    <span class="dot" id="live" title="connecting…"></span>
    catchbox
  </span>

  <button class="address" id="address" title="Copy this address">
    <span id="address-text">…</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
    </svg>
  </button>

  <span class="grow"></span>

  <button class="btn ghost back" id="back">← Inbox</button>
  <button class="btn ghost icon" id="settings-open" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
    </svg>
  </button>
  <button class="btn ghost icon" id="theme" title="Switch theme" aria-label="Switch theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</header>

<div class="shell" id="shell">
  <nav class="rail" id="rail" aria-label="Mailboxes"></nav>

  <div class="panes" id="panes">
    <aside class="sidebar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Filter by sender, subject or code…" autocomplete="off">
      </div>
      <ul class="list" id="list" role="listbox" aria-label="Inbox"></ul>
    </aside>

    <main class="detail" id="detail"></main>
  </div>
</div>

<section class="settings" id="settings" hidden>
  <div class="settings-inner">
    <div class="settings-head">
      <h1>Settings</h1>
      <button class="btn" id="settings-close">Done</button>
    </div>
    <div id="settings-body"></div>
  </div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
